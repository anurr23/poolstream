; Performa untuk project yang di-mount dari Windows (bind mount lambat untuk stat()).
; Pasang ke container: docker cp docker/php/zzz-performance.ini php8.5-apache:/usr/local/etc/php/conf.d/
; lalu: docker restart php8.5-apache
;
; Catatan: validate_timestamps=0 membuat halaman ~0.3s (vs 2-8s bila On), tetapi
; perubahan file PHP baru terbaca setelah opcache di-reset / container di-restart.
; revalidate_freq tidak menolong: 500+ stat() ke bind mount Windows tetap mahal.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
realpath_cache_size=16M
realpath_cache_ttl=600
