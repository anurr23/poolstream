<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="42" font-size="26" font-weight="700" fill="#111827">Cara Pasang Relay USB 2 Channel + Lampu Meja</text>
  <text x="40" y="68" font-size="15" fill="#6b7280">PoolStream &#183; 1 board = 2 meja &#183; relay hanya memutus FASA (kabel merah), netral selalu tersambung</text>

  <!-- warning box -->
  <rect x="700" y="86" width="460" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="110" font-size="14" font-weight="700" fill="#b91c1c">CABUT LISTRIK DULU. 220V bisa mematikan.</text>
  <text x="720" y="132" font-size="13" fill="#b91c1c">Semua kabel 220V harus masuk kotak/casing tertutup + sekring.</text>

  <!-- source -->
  <rect x="40" y="110" width="150" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="115" y="143" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">STOP KONTAK</text>
  <text x="115" y="165" font-size="14" fill="#9a3412" text-anchor="middle">220V AC</text>
  <text x="115" y="188" font-size="12" fill="#9a3412" text-anchor="middle">sumber listrik</text>
  <circle cx="190" cy="135" r="5" fill="#dc2626"/>
  <circle cx="190" cy="205" r="5" fill="#2563eb"/>
  <text x="176" y="128" font-size="12" font-weight="700" fill="#dc2626">L</text>
  <text x="176" y="198" font-size="12" font-weight="700" fill="#2563eb">N</text>

  <!-- MCB -->
  <rect x="210" y="118" width="80" height="34" rx="5" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="250" y="140" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">MCB 2A</text>

  <!-- fasa rail -->
  <path d="M190,135 H210" stroke="#dc2626" stroke-width="5" fill="none"/>
  <path d="M290,135 H300 V540 H500" stroke="#dc2626" stroke-width="5" fill="none"/>
  <path d="M395,540 V410" stroke="#dc2626" stroke-width="5" fill="none"/>
  <path d="M500,540 V410" stroke="#dc2626" stroke-width="5" fill="none"/>
  <circle cx="395" cy="540" r="5" fill="#dc2626"/>

  <!-- neutral rail -->
  <path d="M190,205 V720 H900 V480" stroke="#2563eb" stroke-width="5" fill="none"/>
  <path d="M860,480 H900" stroke="#2563eb" stroke-width="5" fill="none"/>
  <path d="M860,630 H900" stroke="#2563eb" stroke-width="5" fill="none"/>
  <circle cx="900" cy="630" r="5" fill="#2563eb"/>

  <!-- NO1 to lamp 1 (with hop over COM2 riser) -->
  <path d="M350,410 V480 H488 A12,12 0 0 1 512,480 H740" stroke="#dc2626" stroke-width="5" fill="none"/>

  <!-- NO2 to lamp 2 -->
  <path d="M545,410 V630 H740" stroke="#dc2626" stroke-width="5" fill="none"/>

  <!-- NC stubs -->
  <path d="M440,410 V432" stroke="#9ca3af" stroke-width="4" fill="none"/>
  <path d="M590,410 V432" stroke="#9ca3af" stroke-width="4" fill="none"/>
  <path d="M433,425 L447,439 M447,425 L433,439" stroke="#9ca3af" stroke-width="3"/>
  <path d="M583,425 L597,439 M597,425 L583,439" stroke="#9ca3af" stroke-width="3"/>
  <text x="440" y="458" font-size="11" fill="#9ca3af" text-anchor="middle">NC tidak dipakai</text>
  <text x="600" y="458" font-size="11" fill="#9ca3af" text-anchor="middle">NC tidak dipakai</text>

  <!-- relay board -->
  <rect x="320" y="170" width="300" height="240" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="470" y="200" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">USB RELAY 2 CHANNEL (HID)</text>
  <text x="470" y="220" font-size="11" fill="#4338ca" text-anchor="middle">relay Songle 10A / 250VAC &#183; no driver</text>

  <rect x="356" y="238" width="100" height="70" rx="6" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="406" y="278" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">RELAY 1</text>
  <rect x="484" y="238" width="100" height="70" rx="6" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="534" y="278" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">RELAY 2</text>

  <!-- terminal strip -->
  <rect x="330" y="394" width="280" height="16" rx="3" fill="#94a3b8"/>
  <g font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">
    <text x="350" y="390">NO1</text>
    <text x="395" y="390">COM1</text>
    <text x="440" y="390">NC1</text>
    <text x="500" y="390">COM2</text>
    <text x="545" y="390">NO2</text>
    <text x="590" y="390">NC2</text>
  </g>

  <!-- USB connector + cable (hops over the live wire) -->
  <rect x="312" y="300" width="16" height="26" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <path d="M190,352 H292 A8,8 0 0 1 308,352 V326" stroke="#64748b" stroke-width="4" fill="none"/>
  <text x="200" y="338" font-size="11" fill="#475569">kabel USB</text>

  <!-- PC -->
  <rect x="40" y="300" width="150" height="110" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="115" y="335" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">PC KASIR</text>
  <text x="115" y="357" font-size="12" fill="#475569" text-anchor="middle">port USB</text>
  <text x="115" y="376" font-size="11" fill="#475569" text-anchor="middle">php artisan serve</text>

  <!-- lamp 1 -->
  <rect x="740" y="440" width="120" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <path d="M800,452 a18,18 0 1 0 0.1,0" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="800" y="508" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">LAMPU 1</text>
  <circle cx="740" cy="480" r="4" fill="#dc2626"/>
  <circle cx="860" cy="480" r="4" fill="#2563eb"/>
  <text x="920" y="472" font-size="11" fill="#b45309">Meja 1</text>
  <text x="920" y="486" font-size="11" font-weight="700" fill="#b45309">CH 1</text>

  <!-- lamp 2 -->
  <rect x="740" y="590" width="120" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <path d="M800,602 a18,18 0 1 0 0.1,0" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="800" y="658" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">LAMPU 2</text>
  <circle cx="740" cy="630" r="4" fill="#dc2626"/>
  <circle cx="860" cy="630" r="4" fill="#2563eb"/>
  <text x="920" y="622" font-size="11" fill="#b45309">Meja 2</text>
  <text x="920" y="636" font-size="11" font-weight="700" fill="#b45309">CH 2</text>

  <!-- step numbers -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="60" cy="92" r="13" fill="#111827"/><text x="60" y="97">1</text>
    <circle cx="250" cy="100" r="13" fill="#111827"/><text x="250" y="105">2</text>
    <circle cx="278" cy="215" r="13" fill="#111827"/><text x="278" y="220">3</text>
    <circle cx="700" cy="410" r="13" fill="#111827"/><text x="700" y="415">4</text>
    <circle cx="60" cy="290" r="13" fill="#111827"/><text x="60" y="295">5</text>
  </g>

  <!-- legend + notes -->
  <rect x="40" y="748" width="1120" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M60,772 H100" stroke="#dc2626" stroke-width="5"/>
  <text x="108" y="777" font-size="12" fill="#374151">Fasa / L (diputus relay)</text>
  <path d="M330,772 H370" stroke="#2563eb" stroke-width="5"/>
  <text x="378" y="777" font-size="12" fill="#374151">Netral / N (selalu tersambung ke lampu)</text>
  <path d="M700,772 H740" stroke="#64748b" stroke-width="4"/>
  <text x="748" y="777" font-size="12" fill="#374151">USB (jangan untuk 220V)</text>
  <text x="60" y="798" font-size="11" fill="#6b7280">Urutan pin NO/COM/NC di PCB bisa berbeda dari gambar &#8212; tes dulu dengan multimeter (mode continuity) sebelum colok 220V. Tandai kabel dengan label.</text>
</svg>
